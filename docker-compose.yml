services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://postit:${MYSQL_PASSWORD:-change-me}@mysql:3306/postit
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: postit
      MYSQL_USER: postit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "postit", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
