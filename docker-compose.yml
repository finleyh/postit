services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://postit:${MYSQL_PASSWORD:-change-me}@mysql:3306/postit
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postitrtr.rule=HOST(`postit.trashcollector.dev`)"
      - "traefik.http.routers.postitrtr.entrypoints=https"
      - "traefik.http.routers.postitrtr.tls.certresolver=letsencrypt"
      - "traefik.http.services.postitrtr.loadbalancer.server.port=8080"
      - "traefik.docker.network=dev_lab"
    networks:
      - dev_lab
      - default

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: postit
      MYSQL_USER: postit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes:
      - /mnt/images/postit_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "postit", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
